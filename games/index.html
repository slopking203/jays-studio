<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jay's retro hybrid games: classic games smashed together, playable in your browser. First round of each is free.">
<title>Arcade · Jay's Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* The arcade cabinet from the 3D studio as a page: one card per game, newest first.
     Same lamp-lit night palette as the 2D site. */
  :root {
    color-scheme: dark;
    --ink: #1b1c1a; --raise: #262724; --line: rgba(243,239,228,0.14);
    --green: #508B3F; --gold: #FFC857; --paper: #f3efe4; --muted: #b9b7ab;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--paper);
    font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
    background-image: radial-gradient(120% 60% at 50% -10%, rgba(255,200,87,0.12), transparent 60%); background-repeat: no-repeat;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 18px; flex-wrap: wrap; }
  .bar a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; }
  .bar a:hover { color: var(--paper); }
  h1 { margin: 28px 0 6px; font: 700 clamp(26px, 7vw, 38px)/1.1 var(--font-display); letter-spacing: 0.01em; }
  .lede { margin: 0 0 24px; color: var(--muted); }
  .lede b { color: var(--gold); font-weight: 600; }
  .games { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .game {
    display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center;
    padding: 14px; border-radius: 14px; background: var(--raise); border: 1px solid var(--line);
    color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
  }
  .game:hover, .game:focus-visible { border-color: rgba(255,200,87,0.55); transform: translateY(-1px); }
  .game:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .tile { width: 64px; height: 64px; border-radius: 12px; display: grid; place-items: center; font: 700 22px/1 var(--font-display); color: var(--ink); }
  .game strong { display: block; font: 700 17px/1.25 var(--font-display); }
  .game small { display: block; color: var(--gold); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin: 3px 0 4px; }
  .game span.b { display: block; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .play { font-weight: 600; color: var(--paper); background: var(--green); padding: 9px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
  .note { margin: 22px 0 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 420px) {
    .game { grid-template-columns: 52px 1fr; }
    .tile { width: 52px; height: 52px; font-size: 18px; }
    .play { grid-column: 2; justify-self: start; }
  }
  @media (prefers-reduced-motion: reduce) { .game { transition: none; } .game:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a href="/">← Jay's Studio</a>
    <a href="/studio/">Walk the 3D studio</a>
  </div>
  <h1>The arcade</h1>
  <p class="lede">Classic games smashed together, one new mashup a month. <b>Your first round of each is free.</b> After that, drop your email once and every game is unlocked.</p>
  <ul class="games" id="games"></ul>
  <p class="note">Signing up also gets you my free ebook, AI for Normies.</p>
</div>
<script src="../site-data.js"></script>
<script>
(function () {
  var A = (window.SITE && window.SITE.links && window.SITE.links.arcade) || {};
  var colors = ["#FFC857", "#508B3F", "#f3efe4", "#FFC857", "#508B3F"];
  var list = document.getElementById("games");
  (A.items || []).forEach(function (g, i) {
    if (!g || !g.url) return;
    var li = document.createElement("li");
    var a = document.createElement("a"); a.className = "game"; a.href = g.url;
    var t = document.createElement("span"); t.className = "tile"; t.setAttribute("aria-hidden", "true");
    t.style.background = colors[i % colors.length];
    t.textContent = g.name.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
    var mid = document.createElement("span");
    var n = document.createElement("strong"); n.textContent = g.name;
    var m = document.createElement("small"); m.textContent = g.mashup || "";
    var b = document.createElement("span"); b.className = "b"; b.textContent = g.blurb || "";
    mid.appendChild(n); if (g.mashup) mid.appendChild(m); if (g.blurb) mid.appendChild(b);
    var p = document.createElement("span"); p.className = "play"; p.textContent = "Play";
    a.appendChild(t); a.appendChild(mid); a.appendChild(p); li.appendChild(a); list.appendChild(li);
  });
})();
</script>
</body>
</html>
