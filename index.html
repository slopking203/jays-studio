<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Videos, retro hybrid games, projects and a free ebook: 10 Things You Can Do With AI.">
<title>Jay's Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Layout idea: the 3D studio flattened into one phone-width column. Same lamp-lit night palette,
     each section labelled with the object it hangs on in the 3D room, the free ebook up top.
     Single dark theme by choice, to match the 3D studio. */
  :root {
    color-scheme: dark;
    --ink: #1b1c1a;
    --charcoal: #2E2E2E;
    --raise: #262724;
    --line: rgba(243,239,228,0.14);
    --green: #508B3F;
    --gold: #FFC857;
    --paper: #f3efe4;
    --muted: #b9b7ab;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--ink); color: var(--paper);
    font-family: var(--font-body); font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 40px;
    background-image: radial-gradient(120% 60% at 50% -10%, rgba(255,200,87,0.12), transparent 60%);
    background-repeat: no-repeat;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* top bar */
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 18px; flex-wrap: wrap; }
  .wordmark { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .wordmark span { color: var(--gold); }
  .wordmark b { font: 600 11px/1 var(--font-body); letter-spacing: 0.1em; color: var(--ink); background: var(--green); padding: 5px 7px; border-radius: 5px; }
  .pill {
    font: 600 14px/1 var(--font-body); color: var(--paper); text-decoration: none; white-space: nowrap;
    border: 1px solid rgba(243,239,228,0.28); padding: 10px 14px; border-radius: 999px;
  }
  .pill:hover { border-color: var(--gold); }

  /* intro */
  .intro { display: flex; gap: 16px; align-items: center; }
  .disc {
    flex: none; width: 72px; height: 72px; border-radius: 50%; background: var(--gold); color: var(--charcoal);
    display: grid; place-items: center; font: 700 34px/1 var(--font-display);
    box-shadow: 0 0 0 4px var(--ink), 0 0 0 6px var(--green);
  }
  .intro h1 { margin: 0; font: 700 24px/1.15 var(--font-display); text-wrap: balance; }
  .intro p { margin: 4px 0 0; color: var(--muted); max-width: 46ch; }

  /* ebook */
  .ebook {
    display: grid; grid-template-columns: 112px 1fr; gap: 18px; align-items: start;
    background: var(--raise); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
  }
  .cover {
    position: relative; width: 112px; aspect-ratio: 400 / 520; max-width: 100%; border-radius: 3px 6px 6px 3px; overflow: hidden;
    background: var(--gold); color: var(--charcoal); padding: 10px 8px 0 16px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.5), inset 7px 0 0 var(--charcoal);
    transform: rotate(-3deg);
  }
  .cover .n { display: block; font: 700 40px/0.9 var(--font-display); }
  .cover .t { display: block; margin-top: 6px; font: 700 10.5px/1.15 var(--font-display); text-transform: uppercase; }
  .cover .f { position: absolute; left: 7px; right: 0; bottom: 0; background: var(--green); color: var(--paper); font: 600 9px/1 var(--font-body); letter-spacing: 0.12em; padding: 8px 9px; }
  .ebook .kicker { margin: 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
  .ebook h2 { margin: 4px 0 6px; font: 700 20px/1.2 var(--font-display); text-wrap: balance; }
  .ebook .pitch { margin: 0; color: var(--muted); }
  .ebook form, .ebook .golink { grid-column: 1 / -1; }
  form { display: flex; flex-direction: column; gap: 8px; margin: 0; }
  form label { font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input {
    flex: 1 1 200px; min-width: 0; font: 500 16px/1.2 var(--font-body); color: var(--paper);
    background: rgba(243,239,228,0.06); border: 1px solid rgba(243,239,228,0.3); border-radius: 999px; padding: 13px 16px;
  }
  input::placeholder { color: #8d8b81; }
  input:focus { border-color: var(--gold); outline: none; }
  .go {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border: 0; cursor: pointer;
    font: 600 15px/1 var(--font-body); color: var(--ink); background: var(--gold); padding: 14px 18px; border-radius: 999px;
  }
  .go:hover { background: #ffd67e; }
  .note { margin: 0; font-size: 13px; color: var(--gold); }

  /* sections */
  section { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  section h2 { margin: 0; font: 700 18px/1.2 var(--font-display); }
  section > p { margin: 0; color: var(--muted); max-width: 52ch; }
  .links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .link {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none;
    padding: 14px 16px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line);
  }
  a.link:hover { border-color: var(--gold); }
  .link span { min-width: 0; display: flex; flex-direction: column; }
  .link strong { font-weight: 600; }
  .link small { color: var(--muted); font-size: 13px; }
  .link i { font-style: normal; color: var(--gold); flex: none; }
  .link.soon i { color: var(--muted); font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; }
  .chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips li { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,200,87,0.4); color: var(--gold); }

  .player { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .sub { align-self: flex-start; }

  footer { border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

  @media (max-width: 420px) {
    .ebook { grid-template-columns: 84px 1fr; gap: 14px; }
    .cover { width: 84px; padding: 8px 6px 0 13px; }
    .cover .n { font-size: 30px; }
    .cover .t { font-size: 8px; }
    .cover .f { font-size: 7px; padding: 6px 7px; }
  }
  @media (prefers-reduced-motion: reduce) { .cover { transform: none; } }
</style>
<style>html,body{margin:0}</style>
</head>
<body>


<div class="wrap">
  <header class="bar">
    <p class="wordmark">Jay's <span>Studio</span> <b>2D</b></p>
    <a class="pill" id="to3d" href="/studio/">Walk the 3D studio ↗</a>
  </header>

  <div class="intro">
    <div class="disc" aria-hidden="true">J</div>
    <div>
      <h1 id="name">Jay's Studio</h1>
      <p id="about"></p>
    </div>
  </div>

  <article class="ebook" aria-labelledby="ebookTitle">
    <div class="cover" aria-hidden="true">
      <span class="n">10</span>
      <span class="t">Things you can do with AI</span>
      <span class="f">FREE EBOOK</span>
    </div>
    <div>
      <p class="kicker" id="ebookKicker">Free ebook</p>
      <h2 id="ebookTitle">10 Things You Can Do With AI</h2>
      <p class="pitch" id="ebookPitch"></p>
    </div>
    <form id="signup" novalidate>
      <label for="email">Your email</label>
      <div class="row">
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
        <button class="go" id="signupBtn" type="submit">Send me the ebook</button>
      </div>
      <p class="note" id="note" role="status" hidden></p>
    </form>
    <a class="go golink" id="signupLink" href="#" target="_blank" rel="noopener" hidden>Send me the ebook ↗</a>
  </article>

  <div id="sections"></div>

  <footer>
    <span>Same links as the 3D room, no walking.</span>
    <a class="pill" id="to3dFoot" href="/studio/">Walk the 3D studio ↗</a>
  </footer>
</div>

<script src="/site-data.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const SITE = window.SITE;
  if (!SITE) { $("sections").textContent = "The links didn't load. Try refreshing the page."; return; }
  const L = SITE.links || {}, E = SITE.ebook || {};

  /* intro + 3D links */
  $("about").textContent = SITE.about || SITE.tagline || "";
  if (SITE.versions && SITE.versions.studio) { $("to3d").href = SITE.versions.studio; $("to3dFoot").href = SITE.versions.studio; }

  /* ebook */
  $("ebookKicker").textContent = E.kicker || "Free ebook";
  $("ebookTitle").textContent = E.title || "Free ebook";
  $("ebookPitch").textContent = E.pitch || "";
  $("signupBtn").textContent = E.cta || "Send me the ebook";
  if (E.signupUrl) {
    $("signup").hidden = true;
    const a = $("signupLink"); a.href = E.signupUrl; a.textContent = (E.cta || "Get the ebook") + " ↗"; a.hidden = false;
  }
  $("signup").addEventListener("submit", (e) => {
    e.preventDefault();
    const note = $("note"), v = $("email").value.trim();
    note.hidden = false;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { note.textContent = "Enter an email address like name@example.com."; $("email").focus(); return; }
    if (!window.SITE_SUBSCRIBE || !E.kitFormAction) { note.textContent = "Signups open soon. This form isn't connected yet, so nothing was saved."; return; }
    const btn = $("signupBtn"); btn.disabled = true; note.textContent = "Sending…";
    window.SITE_SUBSCRIBE(v).then((how) => {
      note.textContent = how === "fallback" ? "Finish signing up in the tab that just opened." : (E.done || "You're on the list. Check your inbox.");
      if (how === "ok") $("email").value = "";
    }, (why) => {
      note.textContent = why === "invalid" ? "That address didn't go through. Check it and try again." : "Something went wrong. Try again in a minute.";
    }).finally(() => { btn.disabled = false; });
  });

  /* sections, built from the same entries as the 3D room */
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function linkRow(title, sub, url) {
    const li = el("li");
    const row = el(url ? "a" : "div", "link" + (url ? "" : " soon"));
    if (url) { row.href = url; row.target = "_blank"; row.rel = "noopener"; }
    const s = el("span"); s.appendChild(el("strong", null, title)); if (sub) s.appendChild(el("small", null, sub));
    row.appendChild(s); row.appendChild(el("i", null, url ? "↗" : "coming soon"));
    li.appendChild(row); return li;
  }
  function section(where, heading, blurb) {
    const sec = el("section");
    sec.appendChild(el("p", "eyebrow", where));
    sec.appendChild(el("h2", null, heading));
    if (blurb) sec.appendChild(el("p", null, blurb));
    $("sections").appendChild(sec); return sec;
  }
  const host = $("sections"); host.style.display = "flex"; host.style.flexDirection = "column"; host.style.gap = "28px";

  // Watch: the TV channels plus TikTok from the phone tripod
  const watch = section((L.tv && L.tv.where ? L.tv.where + " + " : "") + (L.phone && L.phone.where ? L.phone.where.toLowerCase() : ""), "Watch", L.tv ? L.tv.blurb : "");
  // Newest uploads from the first channel that has a player, with a subscribe button
  const lead = (SITE.channels || []).find((c) => window.SITE_PLAYER && window.SITE_PLAYER(c));
  if (lead) {
    const box = el("div", "player");
    const f = document.createElement("iframe");
    f.src = window.SITE_PLAYER(lead); f.title = "Latest " + (lead.name || "channel") + " videos"; f.loading = "lazy";
    f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    f.allowFullscreen = true; f.referrerPolicy = "strict-origin-when-cross-origin";
    box.appendChild(f); watch.appendChild(box);
    if (lead.subscribe) {
      const a = el("a", "go sub", "Subscribe to " + (lead.name || "the channel") + " ↗"); a.href = lead.subscribe; a.target = "_blank"; a.rel = "noopener";
      watch.appendChild(a);
    }
  }
  const wl = el("ul", "links");
  (SITE.channels || []).forEach((c) => wl.appendChild(linkRow(c.name || c.title, c.blurb, c.url)));
  if (L.phone) wl.appendChild(linkRow(L.phone.title, L.phone.blurb, L.phone.url));
  watch.appendChild(wl);

  // Play, Build, About
  [["arcade", "Play"], ["laptop", "Build"], ["frame", "About"]].forEach(([k, h]) => {
    const it = L[k]; if (!it) return;
    const sec = section(it.where, h, it.blurb);
    if (it.items && it.items.length) {
      const ul = el("ul", "chips"); it.items.forEach((t) => ul.appendChild(el("li", null, t))); sec.appendChild(ul);
    }
    const ul = el("ul", "links"); ul.appendChild(linkRow(it.title, it.url ? it.cta : "", it.url)); sec.appendChild(ul);
  });
})();
</script>

</body>
</html>
